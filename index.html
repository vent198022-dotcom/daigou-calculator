<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="代購試算">
  <title>代購商品費用試算表</title>

  <!-- 引入 Tailwind CSS 來處理畫面美化 -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 引入 React 核心套件 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- 引入 Babel 讓瀏覽器可以讀懂 React 語法 -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">

  <!-- React 應用程式的掛載點 -->
  <div id="root"></div>

  <!-- 主要的程式邏輯 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // 共用的數字輸入框
    // 字級 16px（text-base）避免 iPhone 點輸入框時畫面自動放大；inputMode 讓手機跳出數字鍵盤
    const NumberInput = ({ value, onChange, placeholder, list, tone = 'gray', ariaLabel }) => (
      <input
        type="number"
        inputMode="decimal"
        min="0"
        step="any"
        placeholder={placeholder}
        list={list}
        aria-label={ariaLabel}
        value={value}
        onChange={(e) => onChange(e.target.value)}
        className={`w-full min-w-0 px-3 py-2 text-base border rounded-lg focus:outline-none focus:ring-2 focus:border-transparent transition-all ${
          tone === 'green'
            ? 'border-green-300 bg-green-50 focus:ring-green-500'
            : 'border-gray-300 bg-white focus:ring-blue-500'
        }`}
      />
    );

    // 欄位標題（主標 + 灰色小字說明）
    const FieldLabel = ({ title, hint }) => (
      <label className="block mb-1 leading-tight">
        <span className="text-xs font-medium text-gray-600">{title}</span>
        {hint && <span className="block text-[11px] text-gray-400">{hint}</span>}
      </label>
    );

    const Calculator = () => {
      // 定義初始的幣別資料
      // discount：折數（9 = 9折、85 = 85折，留空 = 不打折）；fee：手續費百分比（10 = 加收10%）
      const initialCurrencies = [
        { name: '美金', code: 'USD', price: '', discount: '', rate: '', weight: '', fee: '10' },
        { name: '歐元', code: 'EUR', price: '', discount: '', rate: '', weight: '', fee: '10' },
        { name: '加幣', code: 'CAD', price: '', discount: '', rate: '', weight: '', fee: '10' },
        { name: '英鎊', code: 'GBP', price: '', discount: '', rate: '', weight: '', fee: '10' },
        { name: '澳幣', code: 'AUD', price: '', discount: '', rate: '', weight: '', fee: '10' },
        { name: '日圓', code: 'JPY', price: '', discount: '', rate: '', weight: '', fee: '10' },
      ];

      const [rows, setRows] = useState(initialCurrencies);
      const [isLoading, setIsLoading] = useState(false);
      const [lastUpdated, setLastUpdated] = useState('');

      // 抓取即時匯率的函數
      const fetchRates = async () => {
        setIsLoading(true);
        try {
          // 台灣銀行牌告匯率 CSV 只允許同網域存取，透過 Jina Reader (r.jina.ai) 轉發以取得 CORS 存取權限
          const bankCsvUrl = 'https://rate.bot.com.tw/xrt/flcsv/0/day';
          const response = await fetch('https://r.jina.ai/' + bankCsvUrl);
          const csvText = await response.text();

          // CSV 每列格式：幣別,本行買入,現金,即期,...(7個遠期),本行賣出,現金,即期,...(7個遠期)
          // 現金賣出欄位在第 13 欄 (index 12)；只挑出以三位大寫幣別代碼開頭的資料列，忽略 Jina 包裝的說明文字
          const bankCashSellRates = {};
          csvText.split(/\r?\n/).forEach(line => {
            const cols = line.split(',');
            const code = cols[0];
            const cashSellRate = parseFloat(cols[12]);
            if (/^[A-Z]{3}$/.test(code) && !isNaN(cashSellRate) && cashSellRate > 0) {
              bankCashSellRates[code] = cashSellRate;
            }
          });

          // 更新各列的匯率（台灣銀行現金賣出匯率 × 加價係數）
          // 用函數式更新，避免抓匯率期間使用者輸入的內容被蓋掉
          setRows(prevRows => prevRows.map(row => {
            const bankRate = bankCashSellRates[row.code];
            if (bankRate === undefined) return row;

            // 統一加價 2.5%，加幣再額外多加 5%
            let adjustedRate = bankRate * 1.025;
            if (row.code === 'CAD') {
              adjustedRate *= 1.05;
            }

            // 日圓取4位小數，其他取2位小數
            const formattedRate = row.code === 'JPY'
              ? adjustedRate.toFixed(4)
              : adjustedRate.toFixed(2);

            return { ...row, rate: formattedRate };
          }));

          // 設定最後更新時間
          const now = new Date();
          setLastUpdated(now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        } catch (error) {
          console.error("匯率抓取失敗:", error);
          alert("無法自動抓取台灣銀行匯率，請手動輸入");
        } finally {
          setIsLoading(false);
        }
      };

      // 組件載入時抓取一次匯率
      useEffect(() => {
        fetchRates();
      }, []);

      // 處理輸入框變更
      const handleInputChange = (index, field, value) => {
        const newRows = rows.map(row => ({ ...row }));
        newRows[index][field] = value;

        // 自動代入其他幣別的價格 (依據當下匯率換算等值金額)
        if (field === 'price') {
          if (value === '') {
            newRows.forEach((row, i) => { if (i !== index) row.price = ''; });
          } else {
            const basePrice = parseFloat(value);
            const baseRate = parseFloat(newRows[index].rate);
            if (!isNaN(basePrice) && !isNaN(baseRate) && baseRate > 0) {
              const twdValue = basePrice * baseRate; // 先轉成台幣價值
              newRows.forEach((row, i) => {
                if (i !== index) {
                  const targetRate = parseFloat(row.rate);
                  if (!isNaN(targetRate) && targetRate > 0) {
                    const equivalentPrice = twdValue / targetRate;
                    // 日圓顯示整數，其他幣別顯示兩位小數
                    row.price = row.code === 'JPY' ? Math.round(equivalentPrice).toString() : equivalentPrice.toFixed(2);
                  }
                }
              });
            }
          }
        }

        // 同步重量、折扣、手續費到其他列（同一件商品在各幣別間共用）
        if (field === 'weight' || field === 'discount' || field === 'fee') {
          newRows.forEach((row, i) => {
            if (i !== index) row[field] = value;
          });
        }

        setRows(newRows);
      };

      // 計算總計：(商品價格 × 折扣 × 匯率 + 重量 × 運費) × (1 + 手續費%)
      const calculateTotal = (row) => {
        const p = parseFloat(row.price) || 0;
        const r = parseFloat(row.rate) || 0;
        const w = parseFloat(row.weight) || 0;
        // 折扣輸入折數：10 以下除以 10（9 → 0.9、8.5 → 0.85），超過 10 除以 100（85 → 0.85）
        // 留空、0 或非數字視為不打折；手續費留空視為 0%
        const discount = parseFloat(row.discount);
        const d = isNaN(discount) || discount <= 0
          ? 1
          : discount <= 10 ? discount / 10 : discount / 100;
        const feePercent = parseFloat(row.fee) || 0;

        // 如果價格和重量都是0，就不顯示計算結果
        if (p === 0 && w === 0) return '-';

        // 判斷運費：日圓為 120，其他為 180
        const weightFee = row.code === 'JPY' ? 120 : 180;
        const total = (p * d * r + w * weightFee) * (1 + feePercent / 100);

        return `NT$ ${Math.round(total).toLocaleString('zh-TW')}`;
      };

      // 折扣、重量、手續費各列同步，手機版只需要顯示一組（取第一列的值，改動時同步到全部）
      const shared = rows[0];

      return (
        <div className="min-h-screen bg-gray-50 sm:p-4 lg:p-8">
          <div className="mx-auto max-w-6xl bg-white sm:rounded-xl shadow-lg overflow-hidden">

            {/* 標題與控制區 */}
            <div className="bg-blue-600 px-4 py-5 sm:p-6 text-white flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-3 lg:gap-4">
              <div>
                <h1 className="text-xl sm:text-2xl font-bold">代購商品費用試算表</h1>
                <p className="text-blue-100 mt-1 text-xs sm:text-sm leading-relaxed">
                  總計 = (商品價格 × 折扣 × 現金賣出匯率 + 重量 × 運費[日圓120/其他180]) × (1 + 手續費%)
                </p>
              </div>

              <div className="flex items-center justify-between lg:justify-start gap-3 bg-blue-700 p-2 rounded-lg text-sm shrink-0">
                <span className="text-blue-100 pl-1">
                  匯率更新：{lastUpdated || '尚未抓取'}
                </span>
                <button
                  onClick={fetchRates}
                  disabled={isLoading}
                  className="flex items-center gap-1 bg-white text-blue-600 px-3 py-1.5 rounded-md hover:bg-blue-50 transition-colors disabled:opacity-50 whitespace-nowrap"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={isLoading ? "animate-spin" : ""}>
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                  </svg>
                  {isLoading ? '更新中...' : '重新整理匯率'}
                </button>
              </div>
            </div>

            {/* 手機、平板視圖（大螢幕隱藏） */}
            <div className="lg:hidden p-3 sm:p-4 space-y-3 sm:space-y-4">

              {/* 共用設定：折扣、重量、手續費對所有幣別都一樣，只輸入一次 */}
              <div className="bg-blue-50 border border-blue-100 rounded-xl p-3 sm:p-4">
                <div className="text-sm font-semibold text-blue-800 mb-2">共用設定（套用到所有幣別）</div>
                <div className="grid grid-cols-3 gap-2 sm:gap-3 items-end">
                  <div>
                    <FieldLabel title="折扣" hint="9 = 9折" />
                    <NumberInput
                      ariaLabel="折扣"
                      placeholder="不打折"
                      value={shared.discount}
                      onChange={(v) => handleInputChange(0, 'discount', v)}
                    />
                  </div>
                  <div>
                    <FieldLabel title="重量 (磅)" hint="運費依幣別" />
                    <NumberInput
                      ariaLabel="重量 (磅)"
                      placeholder="0.0"
                      value={shared.weight}
                      onChange={(v) => handleInputChange(0, 'weight', v)}
                    />
                  </div>
                  <div>
                    <FieldLabel title="手續費 (%)" hint="10 = 10%" />
                    <NumberInput
                      ariaLabel="手續費 (%)"
                      placeholder="0"
                      list="fee-options"
                      value={shared.fee}
                      onChange={(v) => handleInputChange(0, 'fee', v)}
                    />
                  </div>
                </div>
              </div>

              {/* 各幣別卡片：手機一欄、平板兩欄 */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                {rows.map((row, index) => (
                  <div key={`card-${row.code}`} className="bg-white border border-gray-200 rounded-xl shadow-sm p-4">
                    <div className="flex justify-between items-start gap-3 mb-3">
                      <div className="flex items-center gap-2 pt-1">
                        <span className="text-lg font-bold text-gray-800">{row.name}</span>
                        <span className="text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded">{row.code}</span>
                      </div>
                      <div className="text-right">
                        <div className="text-[11px] text-gray-500">總計</div>
                        <div className="text-xl font-bold text-blue-700 leading-tight whitespace-nowrap">{calculateTotal(row)}</div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <FieldLabel title="商品價格" />
                        <NumberInput
                          ariaLabel={`${row.name}商品價格`}
                          placeholder="0.00"
                          value={row.price}
                          onChange={(v) => handleInputChange(index, 'price', v)}
                        />
                      </div>
                      <div>
                        <FieldLabel title="現金賣出匯率" />
                        <NumberInput
                          ariaLabel={`${row.name}現金賣出匯率`}
                          tone="green"
                          value={row.rate}
                          onChange={(v) => handleInputChange(index, 'rate', v)}
                        />
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* 桌面版表格區塊 (大螢幕時顯示，手機、平板隱藏) */}
            <div className="hidden lg:block overflow-x-auto p-6">
              <table className="w-full border-collapse">
                <thead>
                  <tr className="bg-gray-100 text-gray-700 border-y-2 border-gray-300">
                    <th className="p-3 text-left w-24">幣別</th>
                    <th className="p-3 text-left w-32">商品價格</th>
                    <th className="p-3 text-left w-28">折扣<br/><span className="text-xs font-normal text-gray-500">9 = 9折</span></th>
                    <th className="p-3 text-left w-32">現金賣出匯率</th>
                    <th className="p-3 text-left w-28">重量 (磅)</th>
                    <th className="p-3 text-left w-32">手續費 (%)<br/><span className="text-xs font-normal text-gray-500">10 = 10%</span></th>
                    <th className="p-3 text-right text-blue-700 bg-blue-50">總計</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((row, index) => (
                    <tr key={row.code} className="border-b border-gray-200 hover:bg-gray-50 transition-colors">
                      <td className="p-3 font-medium text-gray-800">
                        <div className="flex flex-col">
                          <span>{row.name}</span>
                          <span className="text-xs text-gray-400">{row.code}</span>
                        </div>
                      </td>

                      <td className="p-3">
                        <NumberInput
                          ariaLabel={`${row.name}商品價格`}
                          placeholder="0.00"
                          value={row.price}
                          onChange={(v) => handleInputChange(index, 'price', v)}
                        />
                      </td>

                      <td className="p-3">
                        <NumberInput
                          ariaLabel={`${row.name}折扣`}
                          placeholder="不打折"
                          value={row.discount}
                          onChange={(v) => handleInputChange(index, 'discount', v)}
                        />
                      </td>

                      <td className="p-3">
                        <NumberInput
                          ariaLabel={`${row.name}現金賣出匯率`}
                          tone="green"
                          value={row.rate}
                          onChange={(v) => handleInputChange(index, 'rate', v)}
                        />
                      </td>

                      <td className="p-3">
                        <NumberInput
                          ariaLabel={`${row.name}重量`}
                          placeholder="0.0"
                          value={row.weight}
                          onChange={(v) => handleInputChange(index, 'weight', v)}
                        />
                      </td>

                      <td className="p-3">
                        <NumberInput
                          ariaLabel={`${row.name}手續費`}
                          placeholder="0"
                          list="fee-options"
                          value={row.fee}
                          onChange={(v) => handleInputChange(index, 'fee', v)}
                        />
                      </td>

                      <td className="p-3 text-right font-bold text-gray-800 bg-blue-50/50 whitespace-nowrap">
                        {calculateTotal(row)}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* 手續費常用選項（點輸入框或按向下鍵可快速選擇） */}
            <datalist id="fee-options">
              <option value="10" />
              <option value="12" />
              <option value="15" />
            </datalist>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Calculator />);
  </script>
</body>
</html>
