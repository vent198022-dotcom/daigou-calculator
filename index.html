<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="費用試算">
  <title>商品費用試算表</title>

  <!-- 引入 Tailwind CSS 來處理畫面美化 -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 引入 React 核心套件 -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- 引入 Babel 讓瀏覽器可以讀懂 React 語法 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
</head>
<body class="bg-gray-50">

  <!-- React 應用程式的掛載點 -->
  <div id="root"></div>

  <!-- 主要的程式邏輯 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // 共用的數字輸入框
    // 字級 16px（text-base）避免 iPhone 點輸入框時畫面自動放大；inputMode 讓手機跳出數字鍵盤
    // prefix：輸入框左側的貨幣符號（例如 US$、€）
    const NumberInput = ({ value, onChange, placeholder, list, tone = 'gray', ariaLabel, prefix }) => (
      <div className="relative">
        {prefix && (
          <span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-400">{prefix}</span>
        )}
        <input
          type="number"
          inputMode="decimal"
          min="0"
          step="any"
          placeholder={placeholder}
          list={list}
          aria-label={ariaLabel}
          value={value}
          onChange={(e) => onChange(e.target.value)}
          className={`w-full min-w-0 ${prefix ? 'pl-11' : 'pl-3'} pr-3 py-2 text-base tabular-nums border rounded-lg focus:outline-none focus:ring-2 focus:border-transparent transition-all ${
            tone === 'green'
              ? 'border-green-300 bg-green-50 focus:ring-green-500'
              : 'border-gray-300 bg-white focus:ring-blue-500'
          }`}
        />
      </div>
    );

    // 幣別圓形徽章（貨幣符號）
    const CurrencyBadge = ({ symbol, tone = 'blue' }) => (
      <span className={`inline-flex items-center justify-center w-9 h-9 shrink-0 rounded-full text-xs font-bold ${
        tone === 'amber' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'
      }`}>
        {symbol}
      </span>
    );

    // 欄位標題（主標 + 灰色小字說明）
    const FieldLabel = ({ title, hint }) => (
      <label className="block mb-1 leading-tight">
        <span className="text-xs font-medium text-gray-600">{title}</span>
        {hint && <span className="block text-[11px] text-gray-400">{hint}</span>}
      </label>
    );

    const Calculator = () => {
      // 定義初始的幣別資料
      // discount：折數（9 = 9折、85 = 85折，留空 = 不打折）；fee：手續費百分比（10 = 加收10%）
      const initialCurrencies = [
        { name: '美金', code: 'USD', symbol: 'US$', price: '', discount: '', rate: '', weight: '', fee: '10' },
        { name: '歐元', code: 'EUR', symbol: '€', price: '', discount: '', rate: '', weight: '', fee: '10' },
        { name: '加幣', code: 'CAD', symbol: 'C$', price: '', discount: '', rate: '', weight: '', fee: '10' },
        { name: '英鎊', code: 'GBP', symbol: '£', price: '', discount: '', rate: '', weight: '', fee: '10' },
        { name: '澳幣', code: 'AUD', symbol: 'A$', price: '', discount: '', rate: '', weight: '', fee: '10' },
        { name: '日圓', code: 'JPY', symbol: '¥', price: '', discount: '', rate: '', weight: '', fee: '10' },
      ];

      const [rows, setRows] = useState(initialCurrencies);
      const [isLoading, setIsLoading] = useState(false);
      const [lastUpdated, setLastUpdated] = useState('');
      // 台銀原始美金現金賣出匯率（不加價），給最下方「利潤（美金）」使用
      const [usdBankRate, setUsdBankRate] = useState('');
      // 標題列的「計算方式」說明是否展開
      const [showFormula, setShowFormula] = useState(false);

      // 抓取即時匯率的函數
      const fetchRates = async () => {
        setIsLoading(true);
        try {
          // 台灣銀行牌告匯率 CSV 只允許同網域存取，透過 Jina Reader (r.jina.ai) 轉發以取得 CORS 存取權限
          const bankCsvUrl = 'https://rate.bot.com.tw/xrt/flcsv/0/day';
          const response = await fetch('https://r.jina.ai/' + bankCsvUrl);
          const csvText = await response.text();

          // CSV 每列格式：幣別,本行買入,現金,即期,...(7個遠期),本行賣出,現金,即期,...(7個遠期)
          // 現金賣出欄位在第 13 欄 (index 12)；只挑出以三位大寫幣別代碼開頭的資料列，忽略 Jina 包裝的說明文字
          const bankCashSellRates = {};
          csvText.split(/\r?\n/).forEach(line => {
            const cols = line.split(',');
            const code = cols[0];
            const cashSellRate = parseFloat(cols[12]);
            if (/^[A-Z]{3}$/.test(code) && !isNaN(cashSellRate) && cashSellRate > 0) {
              bankCashSellRates[code] = cashSellRate;
            }
          });

          // 記下美金原始匯率（不加價）
          if (bankCashSellRates.USD !== undefined) {
            setUsdBankRate(String(bankCashSellRates.USD));
          }

          // 更新各列的匯率（台灣銀行現金賣出匯率 × 加價係數）
          // 用函數式更新，避免抓匯率期間使用者輸入的內容被蓋掉
          setRows(prevRows => prevRows.map(row => {
            const bankRate = bankCashSellRates[row.code];
            if (bankRate === undefined) return row;

            // 統一加價 2.5%，加幣再額外多加 5%
            let adjustedRate = bankRate * 1.025;
            if (row.code === 'CAD') {
              adjustedRate *= 1.05;
            }

            // 日圓取4位小數，其他取2位小數
            const formattedRate = row.code === 'JPY'
              ? adjustedRate.toFixed(4)
              : adjustedRate.toFixed(2);

            return { ...row, rate: formattedRate };
          }));

          // 設定最後更新時間
          const now = new Date();
          setLastUpdated(now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        } catch (error) {
          console.error("匯率抓取失敗:", error);
          alert("無法自動抓取台灣銀行匯率，請手動輸入");
        } finally {
          setIsLoading(false);
        }
      };

      // 組件載入時抓取一次匯率
      useEffect(() => {
        fetchRates();
      }, []);

      // 處理輸入框變更
      const handleInputChange = (index, field, value) => {
        const newRows = rows.map(row => ({ ...row }));
        newRows[index][field] = value;

        // 自動代入其他幣別的價格 (依據當下匯率換算等值金額)
        if (field === 'price') {
          if (value === '') {
            newRows.forEach((row, i) => { if (i !== index) row.price = ''; });
          } else {
            const basePrice = parseFloat(value);
            const baseRate = parseFloat(newRows[index].rate);
            if (!isNaN(basePrice) && !isNaN(baseRate) && baseRate > 0) {
              const twdValue = basePrice * baseRate; // 先轉成台幣價值
              newRows.forEach((row, i) => {
                if (i !== index) {
                  const targetRate = parseFloat(row.rate);
                  if (!isNaN(targetRate) && targetRate > 0) {
                    const equivalentPrice = twdValue / targetRate;
                    // 日圓顯示整數，其他幣別顯示兩位小數
                    row.price = row.code === 'JPY' ? Math.round(equivalentPrice).toString() : equivalentPrice.toFixed(2);
                  }
                }
              });
            }
          }
        }

        // 同步重量、折扣、手續費到其他列（同一件商品在各幣別間共用）
        if (field === 'weight' || field === 'discount' || field === 'fee') {
          newRows.forEach((row, i) => {
            if (i !== index) row[field] = value;
          });
        }

        setRows(newRows);
      };

      // 折扣輸入折數：10 以下除以 10（9 → 0.9、8.5 → 0.85），超過 10 除以 100（85 → 0.85）
      // 留空、0 或非數字視為不打折
      const parseDiscount = (value) => {
        const n = parseFloat(value);
        if (isNaN(n) || n <= 0) return 1;
        return n <= 10 ? n / 10 : n / 100;
      };

      // 運費：日圓每磅 120，其他每磅 180
      const shippingPerPound = (code) => (code === 'JPY' ? 120 : 180);

      const formatNT = (amount) => `NT$ ${Math.round(amount).toLocaleString('zh-TW')}`;

      // 計算總計（數字）：(商品價格 × 折扣 × 匯率 + 重量 × 運費) × (1 + 手續費%)
      // 價格和重量都是 0 時回傳 null（不顯示結果）
      const computeTotal = (row) => {
        const p = parseFloat(row.price) || 0;
        const r = parseFloat(row.rate) || 0;
        const w = parseFloat(row.weight) || 0;
        const d = parseDiscount(row.discount);
        const feePercent = parseFloat(row.fee) || 0; // 手續費留空視為 0%

        if (p === 0 && w === 0) return null;

        return (p * d * r + w * shippingPerPound(row.code)) * (1 + feePercent / 100);
      };

      const calculateTotal = (row) => {
        const total = computeTotal(row);
        return total === null ? '-' : formatNT(total);
      };

      // 利潤（美金）= 美金總計 − 成本
      // 成本 = 商品價格 × 折扣 × 台銀原始現金賣出匯率（不加 2.5%）+ 重量 × 180，不加手續費
      // 兩者都先四捨五入成整數再相減，跟畫面上看到的數字一致
      const usdRow = rows.find(row => row.code === 'USD');
      const usdBankRateNum = parseFloat(usdBankRate) || 0;
      const usdRevenue = computeTotal(usdRow);
      // 還沒抓到台銀匯率時不計算，避免成本被當成 0
      const usdCost = (usdRevenue === null || usdBankRateNum <= 0)
        ? null
        : (parseFloat(usdRow.price) || 0) * parseDiscount(usdRow.discount) * usdBankRateNum
          + (parseFloat(usdRow.weight) || 0) * shippingPerPound('USD');
      const usdCostText = usdCost === null ? '-' : formatNT(usdCost);
      const usdProfit = usdCost === null ? null : Math.round(usdRevenue) - Math.round(usdCost);

      const usdProfitText = usdProfit === null ? '-' : `NT$ ${usdProfit.toLocaleString('zh-TW')}`;
      // 利潤：賺錢綠色、虧錢紅色
      const profitColor = usdProfit !== null && usdProfit < 0 ? 'text-red-600' : 'text-green-600';

      // 最低總計的幣別（至少要有一個總計才標示）
      const totals = rows.map(row => computeTotal(row));
      const validTotals = totals.filter(t => t !== null).map(t => Math.round(t));
      const lowestTotal = validTotals.length ? Math.min(...validTotals) : null;
      const isLowest = (i) => totals[i] !== null && Math.round(totals[i]) === lowestTotal;

      // 成本區用的唯讀格子（數字帶入美金那列）
      const ReadOnlyBox = ({ children }) => (
        <div className="w-full px-3 py-2 text-base tabular-nums border border-amber-200 bg-white/70 text-gray-600 rounded-lg min-h-[42px]">
          {children}
        </div>
      );

      // 成本列小字：折扣・重量・手續費 0%
      const costDetail = `${usdRow.discount ? `${usdRow.discount}折` : '不打折'}・${usdRow.weight || 0} 磅・手續費 0%`;

      // 最低價標籤
      const LowestTag = () => (
        <span className="inline-block text-[11px] font-semibold text-green-700 bg-green-100 px-1.5 py-0.5 rounded">最低</span>
      );

      // 折扣、重量、手續費各列同步，共用設定只顯示一組（取第一列的值，改動時同步到全部）
      const shared = rows[0];

      return (
        <div className="min-h-screen bg-gray-100 sm:p-4 lg:p-8">
          <div className="mx-auto max-w-5xl bg-white sm:rounded-2xl shadow-lg overflow-hidden">

            {/* 標題列：標題、匯率更新徽章、重新整理、計算方式 */}
            <div className="bg-blue-600 px-4 py-4 sm:px-6 sm:py-5 text-white">
              <div className="flex items-center justify-between gap-3">
                <h1 className="text-xl sm:text-2xl font-bold">商品費用試算表</h1>
                <button
                  onClick={fetchRates}
                  disabled={isLoading}
                  className="flex items-center gap-1 bg-white text-blue-600 text-sm px-3 py-1.5 rounded-md hover:bg-blue-50 transition-colors disabled:opacity-50 whitespace-nowrap"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={isLoading ? "animate-spin" : ""}>
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                  </svg>
                  {isLoading ? '更新中...' : '更新匯率'}
                </button>
              </div>
              <div className="flex flex-wrap items-center gap-2 mt-2 text-xs">
                <span className="bg-blue-700/70 text-blue-50 px-2 py-1 rounded-full">
                  台銀匯率 {lastUpdated ? `${lastUpdated} 更新` : '尚未抓取'}
                </span>
                <button
                  onClick={() => setShowFormula(!showFormula)}
                  className="text-blue-100 hover:text-white px-2 py-1 rounded-full border border-blue-400/60"
                >
                  ⓘ 計算方式 {showFormula ? '▴' : '▾'}
                </button>
              </div>
              {showFormula && (
                <div className="mt-3 bg-blue-700/60 rounded-lg p-3 text-xs sm:text-sm text-blue-50 leading-relaxed space-y-1">
                  <div>總計 = (商品價格 × 折扣 × 匯率 + 重量 × 運費) × (1 + 手續費%)</div>
                  <div>運費：日圓每磅 120，其他每磅 180</div>
                  <div>匯率：台銀現金賣出 × 1.025（加幣再 × 1.05）</div>
                  <div>成本：價格 × 折扣 × 台銀原始匯率 + 運費，不加手續費</div>
                </div>
              )}
            </div>

            <div className="p-3 sm:p-6 space-y-4 sm:space-y-6">

              {/* 共用設定：折扣、重量、手續費對所有幣別都一樣，只輸入一次 */}
              <section className="bg-blue-50 border border-blue-100 rounded-xl p-3 sm:p-4">
                <div className="text-sm font-semibold text-blue-800 mb-2">共用設定（套用到所有幣別）</div>
                <div className="grid grid-cols-3 gap-2 sm:gap-4 items-end lg:max-w-2xl">
                  <div>
                    <FieldLabel title="折扣" hint="9 = 9折" />
                    <NumberInput
                      ariaLabel="折扣"
                      placeholder="不打折"
                      value={shared.discount}
                      onChange={(v) => handleInputChange(0, 'discount', v)}
                    />
                  </div>
                  <div>
                    <FieldLabel title="重量 (磅)" hint="運費依幣別" />
                    <NumberInput
                      ariaLabel="重量 (磅)"
                      placeholder="0.0"
                      value={shared.weight}
                      onChange={(v) => handleInputChange(0, 'weight', v)}
                    />
                  </div>
                  <div>
                    <FieldLabel title="手續費 (%)" hint="10 = 10%" />
                    <NumberInput
                      ariaLabel="手續費 (%)"
                      placeholder="0"
                      list="fee-options"
                      value={shared.fee}
                      onChange={(v) => handleInputChange(0, 'fee', v)}
                    />
                  </div>
                </div>
              </section>

              {/* 各幣別報價 */}
              <section>
                <h2 className="text-sm font-semibold text-gray-500 mb-2 px-1">各幣別報價</h2>

                {/* 手機、平板：卡片（手機一欄、平板兩欄） */}
                <div className="lg:hidden grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                  {rows.map((row, index) => (
                    <div key={`card-${row.code}`} className={`bg-white border rounded-xl shadow-sm p-4 ${isLowest(index) ? 'border-green-300' : 'border-gray-200'}`}>
                      <div className="flex justify-between items-start gap-3 mb-3">
                        <div className="flex items-center gap-2">
                          <CurrencyBadge symbol={row.symbol} />
                          <div className="leading-tight">
                            <div className="text-base font-bold text-gray-800">{row.name}</div>
                            <div className="text-xs text-gray-400">{row.code}</div>
                          </div>
                        </div>
                        <div className="text-right">
                          <div className="text-[11px] text-gray-500 flex items-center justify-end gap-1">
                            {isLowest(index) && <LowestTag />}總計
                          </div>
                          <div className="text-2xl font-bold text-blue-700 leading-tight tabular-nums whitespace-nowrap">{calculateTotal(row)}</div>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <FieldLabel title="商品價格" />
                          <NumberInput
                            ariaLabel={`${row.name}商品價格`}
                            prefix={row.symbol}
                            placeholder="0.00"
                            value={row.price}
                            onChange={(v) => handleInputChange(index, 'price', v)}
                          />
                        </div>
                        <div>
                          <FieldLabel title="現金賣出匯率" />
                          <NumberInput
                            ariaLabel={`${row.name}現金賣出匯率`}
                            tone="green"
                            value={row.rate}
                            onChange={(v) => handleInputChange(index, 'rate', v)}
                          />
                        </div>
                      </div>
                    </div>
                  ))}

                  {/* 美金成本卡片 */}
                  <div className="bg-amber-50 border border-amber-200 rounded-xl shadow-sm p-4">
                    <div className="flex justify-between items-start gap-3 mb-3">
                      <div className="flex items-center gap-2">
                        <CurrencyBadge symbol="US$" tone="amber" />
                        <div className="leading-tight">
                          <div className="text-base font-bold text-gray-800">美金 <span className="text-red-600">成本</span></div>
                          <div className="text-xs text-gray-500">{costDetail}</div>
                        </div>
                      </div>
                      <div className="text-right">
                        <div className="text-[11px] text-gray-500">成本</div>
                        <div className="text-2xl font-bold text-gray-800 leading-tight tabular-nums whitespace-nowrap">{usdCostText}</div>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <FieldLabel title="商品價格" />
                        <ReadOnlyBox>{usdRow.price ? `US$ ${usdRow.price}` : '-'}</ReadOnlyBox>
                      </div>
                      <div>
                        <FieldLabel title="台銀原始匯率" />
                        <NumberInput
                          ariaLabel="台銀美金現金賣出匯率（原始）"
                          tone="green"
                          value={usdBankRate}
                          onChange={setUsdBankRate}
                        />
                      </div>
                    </div>
                  </div>

                  {/* 利潤（美金） */}
                  <div className="flex justify-between items-center bg-amber-50 border border-amber-200 rounded-xl shadow-sm px-4 py-3">
                    <span className={`text-lg font-bold ${profitColor}`}>利潤（美金）</span>
                    <span className={`text-2xl font-bold tabular-nums whitespace-nowrap ${profitColor}`}>{usdProfitText}</span>
                  </div>
                </div>

                {/* 電腦：表格（只留幣別、價格、匯率、總計） */}
                <div className="hidden lg:block border border-gray-200 rounded-xl overflow-hidden">
                  <table className="w-full border-collapse">
                    <thead>
                      <tr className="bg-gray-50 text-gray-600 text-sm border-b border-gray-200">
                        <th className="px-4 py-3 text-left">幣別</th>
                        <th className="px-4 py-3 text-left w-56">商品價格</th>
                        <th className="px-4 py-3 text-left w-48">現金賣出匯率</th>
                        <th className="px-4 py-3 text-right w-56 text-blue-700">總計</th>
                      </tr>
                    </thead>
                    <tbody>
                      {rows.map((row, index) => (
                        <tr key={row.code} className={`border-b border-gray-100 last:border-b-0 transition-colors ${isLowest(index) ? 'bg-green-50/60' : 'hover:bg-gray-50'}`}>
                          <td className="px-4 py-3">
                            <div className="flex items-center gap-3">
                              <CurrencyBadge symbol={row.symbol} />
                              <div className="leading-tight">
                                <div className="font-semibold text-gray-800">{row.name}</div>
                                <div className="text-xs text-gray-400">{row.code}</div>
                              </div>
                            </div>
                          </td>
                          <td className="px-4 py-3">
                            <NumberInput
                              ariaLabel={`${row.name}商品價格`}
                              prefix={row.symbol}
                              placeholder="0.00"
                              value={row.price}
                              onChange={(v) => handleInputChange(index, 'price', v)}
                            />
                          </td>
                          <td className="px-4 py-3">
                            <NumberInput
                              ariaLabel={`${row.name}現金賣出匯率`}
                              tone="green"
                              value={row.rate}
                              onChange={(v) => handleInputChange(index, 'rate', v)}
                            />
                          </td>
                          <td className="px-4 py-3 text-right whitespace-nowrap">
                            <div className="flex items-center justify-end gap-2">
                              {isLowest(index) && <LowestTag />}
                              <span className="text-xl font-bold text-gray-800 tabular-nums">{calculateTotal(row)}</span>
                            </div>
                          </td>
                        </tr>
                      ))}

                      {/* 美金成本：價格、折扣、重量帶入美金那列，台銀原始匯率，手續費 0 */}
                      <tr className="border-t-2 border-amber-200 bg-amber-50">
                        <td className="px-4 py-3">
                          <div className="flex items-center gap-3">
                            <CurrencyBadge symbol="US$" tone="amber" />
                            <div className="leading-tight">
                              <div className="font-semibold text-gray-800">美金 <span className="text-red-600">成本</span></div>
                              <div className="text-xs text-gray-500">{costDetail}</div>
                            </div>
                          </div>
                        </td>
                        <td className="px-4 py-3">
                          <ReadOnlyBox>{usdRow.price ? `US$ ${usdRow.price}` : '-'}</ReadOnlyBox>
                        </td>
                        <td className="px-4 py-3">
                          <NumberInput
                            ariaLabel="台銀美金現金賣出匯率（原始）"
                            tone="green"
                            value={usdBankRate}
                            onChange={setUsdBankRate}
                          />
                        </td>
                        <td className="px-4 py-3 text-right whitespace-nowrap">
                          <span className="text-xl font-bold text-gray-800 tabular-nums">{usdCostText}</span>
                        </td>
                      </tr>

                      {/* 利潤（美金）= 美金總計 − 美金成本 */}
                      <tr className="bg-amber-50 border-t border-amber-200">
                        <td colSpan={3} className={`px-4 py-3 text-lg font-bold ${profitColor}`}>利潤（美金）</td>
                        <td className={`px-4 py-3 text-right text-2xl font-bold tabular-nums whitespace-nowrap ${profitColor}`}>
                          {usdProfitText}
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </section>

            </div>

            {/* 手續費常用選項（點輸入框或按向下鍵可快速選擇） */}
            <datalist id="fee-options">
              <option value="10" />
              <option value="12" />
              <option value="15" />
            </datalist>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Calculator />);
  </script>
</body>
</html>
